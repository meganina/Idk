<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keypad Security Arsenal</title>
    <style>
        :root { --accent: #ff4444; }
        body { margin: 0; background: #0a0a0a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; overflow: hidden; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 90%; margin-bottom: 20px; }
        .weapon-btn { padding: 15px; border-radius: 8px; border: 2px solid var(--accent); background: rgba(255,255,255,0.05); color: white; font-weight: bold; cursor: pointer; }
        .weapon-btn.active { background: var(--accent); color: black; box-shadow: 0 0 15px var(--accent); }
        
        /* Keypad Overlay */
        #keypad-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
        }
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 200px; margin-top: 20px; }
        .key { width: 60px; height: 60px; border: 2px solid #555; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; border-radius: 50%; }
        #display { font-size: 2rem; letter-spacing: 10px; height: 40px; color: #ff4444; }

        #powerBtn { width: 140px; height: 140px; border-radius: 50%; border: 6px solid var(--accent); background: #1a1a1a; font-size: 1.1rem; color: white; }
    </style>
</head>
<body>

    <div id="keypad-overlay">
        <div id="display">****</div>
        <div class="keypad-grid" id="keys">
            <div class="key" onclick="press(1)">1</div><div class="key" onclick="press(2)">2</div><div class="key" onclick="press(3)">3</div>
            <div class="key" onclick="press(4)">4</div><div class="key" onclick="press(5)">5</div><div class="key" onclick="press(6)">6</div>
            <div class="key" onclick="press(7)">7</div><div class="key" onclick="press(8)">8</div><div class="key" onclick="press(9)">9</div>
            <div></div><div class="key" onclick="press(0)">0</div><div class="key" onclick="press('C')" style="border-color:red; color:red;">C</div>
        </div>
    </div>

    <div class="grid">
        <button id="akMode" class="weapon-btn active" onclick="setMode('ak')">AK-47</button>
        <button id="saberMode" class="weapon-btn" onclick="setMode('saber')">SABER</button>
        <button id="gunMode" class="weapon-btn" onclick="setMode('gun')">GUN</button>
        <button id="taserMode" class="weapon-btn" onclick="setMode('taser')">TASER</button>
        <button id="whipMode" class="weapon-btn" onclick="setMode('whip')">WHIP</button>
        <button id="bombMode" class="weapon-btn" onclick="openKeypad()">DETONATOR</button>
    </div>

    <div id="status">SYSTEM OFFLINE</div>
    <button id="powerBtn">START</button>

    <script>
        let audioCtx, sounds = {}, videoTrack;
        let currentMode = 'ak', isArmed = false, isLocked = false;
        let inputCode = "", correctCode = "6767";

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                videoTrack = stream.getVideoTracks()[0];
            } catch (e) { console.error("Camera fail."); }
        }

        async function toggleFlash(state) {
            if (videoTrack && videoTrack.getCapabilities().torch) {
                try { await videoTrack.applyConstraints({ advanced: [{ torch: state }] }); } catch (e) {}
            }
        }

        function openKeypad() { document.getElementById('keypad-overlay').style.display = 'flex'; }
        
        function press(num) {
            if (num === 'C') { inputCode = ""; }
            else { inputCode += num; }
            document.getElementById('display').innerText = "*".repeat(inputCode.length);
            
            if (inputCode === correctCode) {
                document.getElementById('keypad-overlay').style.display = 'none';
                setMode('bomb');
                inputCode = "";
                document.getElementById('bombMode').innerText = "BOMB UNLOCKED";
            } else if (inputCode.length >= 4) {
                inputCode = "";
                document.getElementById('display').innerText = "WRONG";
                setTimeout(() => document.getElementById('display').innerText = "****", 500);
            }
        }

        async function loadSounds() {
            const files = {
                ak: 'audiomass-output2.mp3', gun: 'audiomass-output2.mp3', 
                whip: 'universfield-whip-02-242215.mp3', taser: 'freesound_community-taser-38490.mp3',
                saberNormal: 'freesound_community-swing3-94210.mp3',
                saberCombo: 'audiomass-output.mp3', bomb: 'audiomass-output3.mp3'
            };
            for (const [key, url] of Object.entries(files)) {
                try {
                    const res = await fetch(url);
                    sounds[key] = await audioCtx.decodeAudioData(await res.arrayBuffer());
                } catch (e) { console.error("Load failed:", key); }
            }
            document.getElementById('status').innerText = "SYSTEMS LIVE";
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.weapon-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(mode + 'Mode')?.classList.add('active');
            const colors = { ak: '#ff4444', saber: '#00e5ff', gun: '#ff8800', whip: '#ffca28', bomb: '#4caf50', taser: '#a200ff' };
            document.documentElement.style.setProperty('--accent', colors[mode]);
        }

        async function play(buffer, vib, lockTime) {
            if (!buffer) return;
            isLocked = true;
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
            toggleFlash(true);
            if (navigator.vibrate) navigator.vibrate(vib);
            document.body.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--accent');
            setTimeout(async () => {
                document.body.style.backgroundColor = "#0a0a0a";
                await toggleFlash(false);
                isLocked = false; 
            }, lockTime); 
        }

        window.addEventListener('devicemotion', (e) => {
            if (!isArmed || isLocked || !sounds.ak) return;
            const force = Math.sqrt(e.acceleration.x**2 + e.acceleration.y**2 + e.acceleration.z**2);
            if (force > 26) {
                if (currentMode === 'ak') { play(sounds.ak, 40, 70); } 
                else if (currentMode === 'taser') { play(sounds.taser, 200, 300); } 
                else if (currentMode === 'bomb') { play(sounds.bomb, 100, 1000); }
                else if (currentMode === 'gun') { play(sounds.gun, 100, 500); } 
                else if (currentMode === 'saber') { play(sounds.saberNormal, 40, 100); }
                else { play(sounds[currentMode], 100, 800); }
            }
        });

        document.getElementById('powerBtn').addEventListener('click', async function() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await initCamera(); await loadSounds();
                isArmed = true; this.innerText = "ARMED";
            }
        });
    </script>
</body>
</html>
